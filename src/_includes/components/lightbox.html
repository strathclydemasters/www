<dialog class="m-auto max-h-none max-w-none bg-transparent p-0 backdrop:bg-[#1e1e1e]/90" data-lightbox-dialog>
	<figure class="flex h-svh w-screen flex-col items-center justify-center p-4 md:p-11">
		<img class="max-h-full max-w-full object-contain" src="" alt="" data-lightbox-image>
		<figcaption class="pt-3 text-center text-sm text-white/90" data-lightbox-caption></figcaption>
	</figure>

	<button type="button" class="absolute top-0 right-0 flex size-11 cursor-pointer items-center justify-center bg-[#1e1e1e]/60 text-2xl text-white/80 hover:text-white" aria-label="Close" data-lightbox-close>{% include 'icons/close.svg' %}</button>
	<button type="button" class="absolute top-1/2 left-0 flex size-11 -translate-y-1/2 cursor-pointer items-center justify-center bg-[#1e1e1e]/60 text-2xl text-white/80 hover:text-white" aria-label="Previous photo" data-lightbox-prev>{% include 'icons/angle-left.svg' %}</button>
	<button type="button" class="absolute top-1/2 right-0 flex size-11 -translate-y-1/2 cursor-pointer items-center justify-center bg-[#1e1e1e]/60 text-2xl text-white/80 hover:text-white" aria-label="Next photo" data-lightbox-next>{% include 'icons/angle-right.svg' %}</button>
</dialog>
